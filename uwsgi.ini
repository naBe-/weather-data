[uwsgi]
mount = /weather-data=app:weather-data
mount = /api=app:weather_api
manage-script-name = true

master = true
processes = 5

pidfile = /tmp/weather-data.pid

uid = www-data
gid = www-data

socket = /tmp/weather-data.sock
chmod-socket = 644
vacuum = true

plugins = python3
env=STATIONS_DB=db/stations.db
die-on-term = true
virtualenv = .venv

# uWSGI runs a mule script only if the value ends in .py: no arguments.
# Log level can be set with the LOG_LEVEL environment variable.
mule=./utils/update_windy.py
